name: Finalize anomaly journey branch

on:
  push:
    branches: ["ux-anomaly-journey-v1"]
    paths: [".ux-journey/CHECK"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX branch
        uses: actions/checkout@v6
        with:
          ref: ux-anomaly-journey-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify integrated source and clean transfer files
        run: |
          set -euo pipefail
          test -f src/components/AnalysisJourneyNav.tsx
          grep -q "Move from signal to management action" src/components/AnalysisJourneyNav.tsx
          grep -q "Investigation journey" src/openwebui-adapt.css
          grep -q "AnalysisJourneyNav" src/AppShell.tsx
          rm -rf .ux-journey
          rm .github/workflows/finalize-ux-anomaly-journey.yml

          npm ci --no-audit --no-fund
          npm test
          npm run build -- --base=/drill-down-anamoly/
          npm run check:bundle

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize simplified anomaly investigation UX"
          git push origin HEAD:ux-anomaly-journey-v1
