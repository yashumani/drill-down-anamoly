name: Architecture hardening branch CI

on:
  push:
    branches: ["architecture-hardening-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run analytical, semantic, agent, and AI regression tests
        run: npm test

      - name: Build production application
        run: npm run build -- --base=/drill-down-anamoly/

      - name: Enforce bundle budget
        run: npm run check:bundle

      - name: Package validated branch source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-hardening-source
          include-hidden-files: true
          path: |
            .github
            docs
            local-ai
            scripts
            services
            src
            index.html
            package.json
            package-lock.json
            vite.config.ts
            tsconfig.app.json
            tsconfig.json
            SECURITY.md
          retention-days: 1
