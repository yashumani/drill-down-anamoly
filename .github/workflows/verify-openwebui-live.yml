name: Verify Open WebUI-inspired live interface

on:
  push:
    branches: ["openwebui-live-verification-v1"]
    paths: [".openwebui-live/VERIFY"]

permissions:
  contents: write

env:
  LIVE_URL: https://yashumani.github.io/drill-down-anamoly/
  TARGET_SHA: aa065c91bd836e506984eea4c5146161c6afdf69

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6
        with:
          ref: openwebui-live-verification-v1
          fetch-depth: 0

      - name: Verify published HTML, JavaScript, and CSS
        run: |
          set -euo pipefail
          mkdir -p live-verification
          curl --retry 8 --retry-all-errors --retry-delay 4 -fsSL "$LIVE_URL" -o live-verification/index.html
          JS_ASSET=$(grep -oE 'assets/index-[^" ]+\.js' live-verification/index.html | head -n 1)
          CSS_ASSET=$(grep -oE 'assets/index-[^" ]+\.css' live-verification/index.html | head -n 1)
          test -n "$JS_ASSET"
          test -n "$CSS_ASSET"
          curl --retry 8 --retry-all-errors --retry-delay 4 -fsSL "${LIVE_URL}${JS_ASSET}" -o live-verification/app.js
          curl --retry 8 --retry-all-errors --retry-delay 4 -fsSL "${LIVE_URL}${CSS_ASSET}" -o live-verification/app.css
          grep -q 'ow-shell' live-verification/app.js
          grep -q 'Variance Copilot' live-verification/app.js
          grep -q 'Presentation Studio' live-verification/app.js
          grep -q 'ow-sidebar' live-verification/app.css
          grep -q 'ow-topbar' live-verification/app.css
          grep -q 'ow-mobile-nav' live-verification/app.css
          printf '%s\n' "$JS_ASSET" > live-verification/js-asset.txt
          printf '%s\n' "$CSS_ASSET" > live-verification/css-asset.txt

      - name: Capture desktop and mobile screenshots
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=10000 --window-size=1440,900 --screenshot=live-verification/openwebui-desktop.png "$LIVE_URL"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=10000 --window-size=390,844 --screenshot=live-verification/openwebui-mobile.png "$LIVE_URL"
          test -s live-verification/openwebui-desktop.png
          test -s live-verification/openwebui-mobile.png

      - name: Upload visual verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwebui-live-verification
          path: live-verification/
          if-no-files-found: error
          retention-days: 2

      - name: Record verification and remove one-use workflow
        run: |
          set -euo pipefail
          JS_ASSET=$(cat live-verification/js-asset.txt)
          CSS_ASSET=$(cat live-verification/css-asset.txt)
          cat > openwebui-live-verification.json <<EOF
          {
            "targetSha": "$TARGET_SHA",
            "liveSite": {
              "url": "$LIVE_URL",
              "httpStatus": 200,
              "javascriptAsset": "$JS_ASSET",
              "cssAsset": "$CSS_ASSET",
              "containsOpenWebShell": true,
              "containsWorkspaceSidebar": true,
              "containsResponsiveMobileNavigation": true,
              "containsPresentationStudio": true
            },
            "screenshots": {
              "desktop": "1440x900",
              "mobile": "390x844"
            },
            "verified": true,
            "checkedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          rm -rf .openwebui-live
          rm .github/workflows/verify-openwebui-live.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Open WebUI-inspired live interface verification"
          git push origin HEAD:openwebui-live-verification-v1
