name: Validate and deploy FP&A intelligence dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "services/**"
      - "local-ai/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/pull_request_template.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-production"
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run analytical, semantic, agent, and AI regression tests
        run: npm test

      - name: Build production application
        run: npm run build -- --base=/drill-down-anamoly/

      - name: Enforce production bundle budget
        run: npm run check:bundle

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
