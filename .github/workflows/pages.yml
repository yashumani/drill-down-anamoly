name: Test and deploy FP&A intelligence dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run analytical regression tests
        run: npm test

      - name: Verify live public dataset
        continue-on-error: true
        run: npm run smoke:public-data

      - name: Build React dashboard
        run: npm run build -- --base=/drill-down-anamoly/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload React build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
