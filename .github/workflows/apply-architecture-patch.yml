name: Integrate investigation snapshot export

on:
  push:
    branches: ["architecture-hardening-v1"]
    paths: [".architecture/INTEGRATE_SNAPSHOT"]

permissions:
  contents: write

jobs:
  integrate-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: architecture-hardening-v1
          fetch-depth: 0

      - name: Apply snapshot integration and commit
        run: |
          set -euo pipefail
          python .architecture/integrate_snapshot.py
          git add src/AppShell.tsx src/final-enhancements.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expose versioned investigation snapshot export"
          git push origin HEAD:architecture-hardening-v1
