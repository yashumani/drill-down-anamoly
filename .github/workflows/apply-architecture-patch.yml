name: Integrate forecast evidence and UI

on:
  push:
    branches: ["architecture-hardening-v1"]
    paths: [".architecture/INTEGRATE_FORECAST_RETRY"]

permissions:
  contents: write

jobs:
  integrate-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: architecture-hardening-v1
          fetch-depth: 0

      - name: Apply forecast integration and commit
        run: |
          set -euo pipefail
          python .architecture/integrate_forecast.py
          git add src/lib/evidenceLedger.ts src/lib/agentOrchestrator.ts src/lib/llm.ts src/components/TimeSeriesCockpit.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate backtested forecast evidence into CFO and AI reviews"
          git push origin HEAD:architecture-hardening-v1
