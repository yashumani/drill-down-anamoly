name: Integrate external event-study lab

on:
  push:
    branches: ["architecture-hardening-v1"]
    paths: [".architecture/INTEGRATE_EXTERNAL_LAB"]

permissions:
  contents: write

jobs:
  integrate-external-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: architecture-hardening-v1
          fetch-depth: 0

      - name: Apply external validation UI and commit
        run: |
          set -euo pipefail
          python .architecture/integrate_external_lab.py
          git add src/AppShell.tsx src/final-enhancements.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add affected-versus-control external event validation lab"
          git push origin HEAD:architecture-hardening-v1
