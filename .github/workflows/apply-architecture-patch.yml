name: Commit reproducible dependency lock

on:
  push:
    branches: ["architecture-hardening-v1"]
    paths: [".architecture/COMMIT_LOCK"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: architecture-hardening-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Generate and commit package lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add reproducible dependency lock"
          git push origin HEAD:architecture-hardening-v1
