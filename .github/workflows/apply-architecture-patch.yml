name: Correct strict finance date parsing

on:
  push:
    branches: ["architecture-hardening-v1"]
    paths: [".architecture/FIX_DATE_PARSING"]

permissions:
  contents: write

jobs:
  fix-date-parsing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: architecture-hardening-v1
          fetch-depth: 0

      - name: Correct ISO date parsing and commit regression test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/timeIntelligence.ts')
          source = path.read_text()
          old = """  match = text.match(/^(19\\d{2}|20\\d{2}|21\\d{2})[-/](0?[1-9]|1[0-2])[-/](0?[1-9]|[12]\\d|3[01])/);\n  if (match) {\n    const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])));\n    return Number.isFinite(date.getTime()) ? { date, precision: 'day' } : null;\n  }\n"""
          new = """  match = text.match(/^(19\\d{2}|20\\d{2}|21\\d{2})[-/](0?[1-9]|1[0-2])[-/](0?[1-9]|[12]\\d|3[01])$/);\n  if (match) {\n    const year = Number(match[1]);\n    const month = Number(match[2]);\n    const day = Number(match[3]);\n    const date = new Date(Date.UTC(year, month - 1, day));\n    const valid = Number.isFinite(date.getTime())\n      && date.getUTCFullYear() === year\n      && date.getUTCMonth() === month - 1\n      && date.getUTCDate() === day;\n    return valid ? { date, precision: 'day' } : null;\n  }\n"""
          if old not in source:
              raise SystemExit('Expected time parsing block was not found.')
          path.write_text(source.replace(old, new))
          PY
          cat > src/lib/timeParsingRegression.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { parseTimeValue } from './timeIntelligence';

          describe('strict finance date parsing', () => {
            it('preserves every two-digit day instead of truncating it', () => {
              expect(parseTimeValue('2025-01-10')?.date.toISOString().slice(0, 10)).toBe('2025-01-10');
              expect(parseTimeValue('2025-01-31')?.date.toISOString().slice(0, 10)).toBe('2025-01-31');
              expect(parseTimeValue('2024-02-29')?.date.toISOString().slice(0, 10)).toBe('2024-02-29');
            });

            it('rejects impossible calendar dates', () => {
              expect(parseTimeValue('2025-02-29')).toBeNull();
              expect(parseTimeValue('2025-04-31')).toBeNull();
            });
          });
          EOF
          git add src/lib/timeIntelligence.ts src/lib/timeParsingRegression.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix strict date parsing for finance time intelligence"
          git push origin HEAD:architecture-hardening-v1
