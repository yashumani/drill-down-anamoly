name: Apply architecture hardening patch

on:
  push:
    branches: ["architecture-hardening-v1"]
    paths: [".architecture/FIX_BUILD_1"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: architecture-hardening-v1
          fetch-depth: 0

      - name: Apply build correction
        run: |
          set -euo pipefail
          if ! grep -q "import { analyzeDataQuality } from './lib/dataQuality';" src/AppShell.tsx; then
            sed -i "/import { investigate } from '.\/lib\/anomaly';/a import { analyzeDataQuality } from '.\/lib\/dataQuality';" src/AppShell.tsx
          fi
          git add src/AppShell.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix data-quality import in hardened application shell"
          git push origin HEAD:architecture-hardening-v1
