name: Apply validated hierarchy deployment repair

on:
  push:
    branches: ["hierarchy-deploy-repair-v2"]
    paths: [".hierarchy-repair/APPLY"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: hierarchy-deploy-repair-v2
          fetch-depth: 0

      - name: Apply validated repair and remove transfer artifacts
        run: |
          set -euo pipefail
          cat .hierarchy-repair/chunk-* | base64 -d | bzip2 -d > /tmp/hierarchy-deploy-repair.patch
          git apply --check /tmp/hierarchy-deploy-repair.patch
          git apply --whitespace=fix /tmp/hierarchy-deploy-repair.patch
          rm -rf .hierarchy-repair
          rm .github/workflows/apply-hierarchy-repair.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy validated hierarchy arc explorer"
          git push origin HEAD:hierarchy-deploy-repair-v2
