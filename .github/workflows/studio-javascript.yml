name: Studio JavaScript regression

on:
  push:
    branches: ["codex/multi-tier-reporting-assurance"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  studio-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Record source identity
        run: python scripts/record_ci_identity.py
      - name: Install locked test tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test application and Studio regressions
        run: npm test
      - name: Verify explicit local client and Python HTTP bridge
        run: node scripts/verify-local-python-bridge.mjs
      - name: Build existing application
        run: npm run build
      - name: Enforce existing bundle budgets
        run: npm run check:bundle

  browser-assurance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Record checked-out browser source identity
        run: python scripts/record_ci_identity.py
      - name: Install development-only browser tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install playwright==1.58.0
          python -m playwright install chromium
      - name: Build existing app without configured live provider
        run: npm run build
      - name: Verify native browser CSP CORS and stale evidence
        run: python scripts/verify_browser_assurance.py --evidence-dir "${{ runner.temp }}/browser-assurance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-assurance-browser-windows
          path: ${{ runner.temp }}/browser-assurance/*
