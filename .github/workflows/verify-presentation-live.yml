name: Verify Presentation Studio live deployment

on:
  push:
    branches: ["presentation-live-verification-v1"]
    paths: [".live-verification/RUN"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6
        with:
          ref: presentation-live-verification-v1
          fetch-depth: 0

      - name: Verify published page and bundle
        run: |
          set -euo pipefail
          BASE_URL="https://yashumani.github.io/drill-down-anamoly/"
          TARGET_SHA="a0152e61ffd7cb88e6240a8ea1089fcf8b4ca125"

          for attempt in $(seq 1 12); do
            STATUS=$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "$BASE_URL" || true)
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 10
          done
          test "$STATUS" = "200"

          ASSET_PATH=$(grep -oE 'src="[^"]*assets/[^"]+\.js"' /tmp/index.html | head -1 | sed 's/^src="//;s/"$//')
          test -n "$ASSET_PATH"
          if [[ "$ASSET_PATH" = /* ]]; then
            ASSET_URL="https://yashumani.github.io${ASSET_PATH}"
          else
            ASSET_URL="${BASE_URL}${ASSET_PATH#./}"
          fi

          BUNDLE_STATUS=$(curl -L -sS -o /tmp/app.js -w '%{http_code}' "$ASSET_URL")
          test "$BUNDLE_STATUS" = "200"
          grep -q "Presentation Studio" /tmp/app.js
          grep -q "Executive infographic" /tmp/app.js
          grep -q "Anomaly register" /tmp/app.js
          grep -q "Questions answered" /tmp/app.js

          cat > presentation-live-verification.json <<JSON
          {
            "targetSha": "$TARGET_SHA",
            "liveSite": {
              "url": "$BASE_URL",
              "httpStatus": $STATUS,
              "assetUrl": "$ASSET_URL",
              "bundleHttpStatus": $BUNDLE_STATUS,
              "containsPresentationStudio": true,
              "containsExecutiveInfographic": true,
              "containsAnomalyRegister": true,
              "containsQuestionsAnswered": true
            },
            "verified": true,
            "checkedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Record verification and clean one-use workflow
        run: |
          set -euo pipefail
          rm -rf .live-verification
          rm .github/workflows/verify-presentation-live.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Presentation Studio live verification"
          git push origin HEAD:presentation-live-verification-v1
