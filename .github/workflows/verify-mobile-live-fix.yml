name: Verify mobile live-demo usability fix

on:
  push:
    branches: ["mobile-live-verification-v1"]
    paths: [".mobile-live/VERIFY"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install browser driver client
        run: python -m pip install --disable-pip-version-check selenium

      - name: Audit the deployed iPhone layout
        env:
          LIVE_URL: https://yashumani.github.io/drill-down-anamoly/#/public
        run: |
          set -euo pipefail
          mkdir -p mobile-live-verification
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--hide-scrollbars')
          options.add_argument('--window-size=390,844')
          options.add_argument('--force-device-scale-factor=1')

          driver = webdriver.Chrome(options=options)
          driver.set_window_size(390, 844)
          try:
              driver.get(os.environ['LIVE_URL'])
              WebDriverWait(driver, 45).until(lambda current: current.execute_script("return document.readyState") == 'complete')
              WebDriverWait(driver, 45).until(lambda current: current.find_elements(By.CSS_SELECTOR, '.live-explore-bar'))
              time.sleep(5)

              visible_count_script = """
              return [...document.querySelectorAll('.info-tip-popover')].filter((element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) > 0.01 && rect.width > 0 && rect.height > 0;
              }).length;
              """
              initial_popovers = driver.execute_script(visible_count_script)
              driver.save_screenshot('mobile-live-verification/mobile-closed.png')

              triggers = [item for item in driver.find_elements(By.CSS_SELECTOR, '.live-explore-bar .info-tip-trigger') if item.is_displayed()]
              assert triggers, 'No visible information controls were found.'
              driver.execute_script('arguments[0].click()', triggers[0])
              time.sleep(.5)
              opened_popovers = driver.execute_script(visible_count_script)
              driver.save_screenshot('mobile-live-verification/mobile-help-open.png')

              topbar = driver.find_element(By.CSS_SELECTOR, '.ow-topbar-title')
              driver.execute_script('arguments[0].click()', topbar)
              time.sleep(.35)
              closed_popovers = driver.execute_script(visible_count_script)

              metrics = driver.execute_script("""
              const bar = document.querySelector('.live-explore-bar');
              const style = getComputedStyle(bar);
              const controls = [...bar.querySelectorAll('select,input,button,summary')]
                .filter((element) => {
                  const itemStyle = getComputedStyle(element);
                  const rect = element.getBoundingClientRect();
                  return itemStyle.display !== 'none' && itemStyle.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
                })
                .map((element) => {
                  const rect = element.getBoundingClientRect();
                  return {
                    tag: element.tagName,
                    text: (element.innerText || element.getAttribute('aria-label') || '').trim().slice(0, 80),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                    top: Math.round(rect.top),
                    bottom: Math.round(rect.bottom),
                    clippedHorizontally: rect.left < -1 || rect.right > innerWidth + 1,
                  };
                });
              const nav = document.querySelector('.live-slide-nav');
              return {
                viewport: { width: innerWidth, height: innerHeight },
                documentWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth - innerWidth,
                controlBar: {
                  borderWidth: style.borderTopWidth,
                  boxShadow: style.boxShadow,
                  borderRadius: style.borderRadius,
                },
                controls,
                clippedControls: controls.filter((item) => item.clippedHorizontally),
                stepNavigation: nav ? {
                  buttons: nav.querySelectorAll('button').length,
                  clientWidth: nav.clientWidth,
                  scrollWidth: nav.scrollWidth,
                  horizontalRail: getComputedStyle(nav).display === 'flex',
                } : null,
              };
              """)

              report = {
                'url': driver.current_url,
                'initialVisibleHelpPanels': initial_popovers,
                'visibleHelpPanelsAfterTap': opened_popovers,
                'visibleHelpPanelsAfterOutsideTap': closed_popovers,
                **metrics,
              }
              Path('mobile-live-verification/audit.json').write_text(json.dumps(report, indent=2), encoding='utf-8')

              assert initial_popovers == 0, report
              assert opened_popovers == 1, report
              assert closed_popovers == 0, report
              assert metrics['horizontalOverflow'] <= 2, report
              assert not metrics['clippedControls'], report
              assert metrics['stepNavigation'] and metrics['stepNavigation']['buttons'] == 6, report
              assert metrics['stepNavigation']['horizontalRail'], report
              assert metrics['controlBar']['borderWidth'] in ('1px', '0px'), report
              assert metrics['controlBar']['boxShadow'] == 'none', report
          finally:
              driver.quit()
          PY

      - name: Upload mobile verification
        uses: actions/upload-artifact@v4
        with:
          name: mobile-live-usability-verification
          path: mobile-live-verification/
          if-no-files-found: error
          retention-days: 2
