name: Apply visual-fit design patch

on:
  push:
    branches: ["ui-visual-fit-tooltips-v1"]
    paths: [".ui-fit-patch/APPLY"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v6
        with:
          ref: ui-visual-fit-tooltips-v1
          fetch-depth: 0

      - name: Apply validated design-only patch and remove transfer files
        run: |
          set -euo pipefail
          cat .ui-fit-patch/chunk-* | base64 -d | bzip2 -d > /tmp/ui-fit.patch
          git apply --check /tmp/ui-fit.patch
          git apply --whitespace=fix /tmp/ui-fit.patch
          rm -rf .ui-fit-patch
          rm .github/workflows/apply-ui-fit.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish exploration visual fit and contextual help"
          git push origin HEAD:ui-visual-fit-tooltips-v1
